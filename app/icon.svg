<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#003152" />
  <!--
    The full logo's open door and its spill of light disappear below 32px and
    only muddy the shape, so the tab icon keeps the C and the H alone, drawn
    heavier so the monogram still reads at 16px.
  -->
  <g transform="translate(50 50) scale(0.82) translate(-50 -50)">
    <path d="M 74 20 A 37 37 0 1 0 74 80" fill="none" stroke="#ffffff" stroke-width="17" />
    <rect x="33" y="24" width="13" height="52" fill="#ffffff" />
    <rect x="54" y="24" width="13" height="52" fill="#ffffff" />
    <rect x="42" y="43" width="14" height="14" fill="#ffffff" />
  </g>
</svg>
